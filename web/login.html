<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tonies-YT Sign in</title>
    <script src="/static/assets/theme.js?v=1"></script>
    <link rel="stylesheet" href="/static/assets/theme.css?v=3" />
    <link rel="stylesheet" href="/static/assets/pages.css?v=1" />
  </head>
  <body>
    <main class="auth">
      <a class="app-brand" href="/" aria-label="Tonies-YT home"><img src="/static/assets/tonie-box-icon.webp?v=1" alt="" width="34" height="34" /><span>Tonies-YT <small>Audio workspace</small></span></a>
      <div class="card">
        <h1>Sign in</h1>
        <p class="desc">Sign in to manage your Tonies.</p>

        <form id="login-form">
          <div class="grid">
            <div>
              <label for="username">Username</label>
              <input id="username" autocomplete="username" />
            </div>
            <div>
              <label for="app-password">Password</label>
              <input id="app-password" type="password" autocomplete="current-password" />
            </div>
          </div>
          <div class="actions"><button id="unlock" type="submit">Sign in</button></div>
        </form>
        <div id="status" class="status" role="status"></div>
      </div>
    </main>

    <script>
      const statusEl = document.getElementById('status');

      async function prefill() {
        const params = new URLSearchParams(window.location.search || '');
        if (params.get('locked') === '1') {
          statusEl.className = 'status';
          statusEl.textContent = 'Signed out. Please sign in again.';
        }

        const r = await fetch('/api/setup/status');
        const d = await r.json();
        if (!d.configured) {
          window.location.href = '/setup';
          return;
        }
      }

      async function waitForUnlocked() {
        for (let i = 0; i < 8; i++) {
          try {
            const r = await fetch('/api/setup/status');
            const d = await r.json();
            if (d?.unlocked) return true;
          } catch {}
          await new Promise((resolve) => setTimeout(resolve, 120));
        }
        return false;
      }

      async function doLogin() {
        const btn = document.getElementById('unlock');
        const username = (document.getElementById('username').value || '').trim();
        const app_password = document.getElementById('app-password').value || '';
        if (!username || !app_password) {
          statusEl.className = 'status err';
          statusEl.textContent = 'Username and password are required.';
          return;
        }

        btn.disabled = true;
        statusEl.className = 'status';
        statusEl.textContent = 'Signing in…';

        try {
          const r = await fetch('/api/setup/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, app_password })
          });
          const d = await r.json();
          if (!d.ok) {
            statusEl.className = 'status err';
            statusEl.textContent = d.error || 'Login failed';
            return;
          }

          const unlocked = await waitForUnlocked();
          if (!unlocked) {
            statusEl.className = 'status err';
            statusEl.textContent = 'Login succeeded, but session state did not settle. Please reload once.';
            return;
          }

          window.location.replace('/');
        } catch (e) {
          statusEl.className = 'status err';
          statusEl.textContent = `Login failed: ${e?.message || e}`;
        } finally {
          btn.disabled = false;
        }
      }

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        await doLogin();
      });

      prefill();
    </script>
  </body>
</html>
