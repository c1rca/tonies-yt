<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tonies-YT Setup</title>
    <script src="/static/assets/theme.js?v=1"></script>
    <link rel="stylesheet" href="/static/assets/theme.css?v=3" />
    <link rel="stylesheet" href="/static/assets/pages.css?v=1" />
  </head>
  <body>
    <main class="auth">
      <a class="app-brand" href="/" aria-label="Tonies-YT home"><img src="/static/assets/tonie-box-icon.webp?v=1" alt="" width="34" height="34" /><span>Tonies-YT <small>Audio workspace</small></span></a>
      <div class="card wide">
        <div class="card-heading">
          <div>
            <h1>Set up Tonies-YT</h1>
            <p class="desc">Create a login for this app and connect your Tonies account. The Tonies password is stored encrypted.</p>
          </div>
          <span id="source-chip" class="chip">source: none</span>
        </div>

        <div class="grid">
          <div>
            <label for="username">App username</label>
            <input id="username" autocomplete="username" placeholder="Username" />
          </div>
          <div>
            <label for="app-password">App password</label>
            <input id="app-password" type="password" autocomplete="new-password" placeholder="Choose a strong password" />
          </div>
          <div>
            <label for="tonies-email">Tonies email</label>
            <input id="tonies-email" type="email" autocomplete="username" placeholder="you@example.com" />
          </div>
          <div>
            <label for="tonies-password">Tonies password</label>
            <input id="tonies-password" type="password" autocomplete="current-password" placeholder="••••••••" />
          </div>
        </div>

        <div class="actions"><button id="create">Finish setup</button></div>
        <div id="status" class="status" role="status"></div>
      </div>
    </main>

    <script>
      const statusEl = document.getElementById('status');
      const sourceChip = document.getElementById('source-chip');

      let toniesFromEnv = false;

      async function refreshStatus() {
        const r = await fetch('/api/setup/status');
        const d = await r.json();
        sourceChip.textContent = `source: ${d.source || 'none'}`;
        toniesFromEnv = d.source === 'env';
        if (toniesFromEnv) {
          for (const id of ['tonies-email', 'tonies-password']) {
            document.getElementById(id).placeholder = 'set by TONIES_EMAIL / TONIES_PASSWORD (optional here)';
          }
        }
        if (d.configured) {
          statusEl.className = 'status';
          statusEl.textContent = d.unlocked
            ? 'Vault already unlocked. Go to app.'
            : 'Vault already exists. Please sign in on /login.';
        }
      }

      document.getElementById('create').onclick = async () => {
        const username = (document.getElementById('username').value || '').trim();
        const app_password = document.getElementById('app-password').value || '';
        const tonies_email = (document.getElementById('tonies-email').value || '').trim();
        const tonies_password = document.getElementById('tonies-password').value || '';

        if (!username || !app_password || (!toniesFromEnv && (!tonies_email || !tonies_password))) {
          statusEl.className = 'status err';
          statusEl.textContent = 'All fields are required.';
          return;
        }

        statusEl.className = 'status';
        statusEl.textContent = 'Running setup…';

        const r = await fetch('/api/setup/init', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, app_password, tonies_email, tonies_password })
        });
        const d = await r.json();
        if (!d.ok) {
          statusEl.className = 'status err';
          statusEl.textContent = `Setup failed: ${d.error || 'Unknown error'}`;
          return;
        }

        statusEl.className = 'status ok';
        statusEl.textContent = 'Vault created. Redirecting…';
        setTimeout(() => { window.location.href = '/'; }, 700);
      };

      refreshStatus();
    </script>
  </body>
</html>
