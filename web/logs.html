<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tonies-YT Logs</title>
    <script src="/static/assets/theme.js?v=1"></script>
    <link rel="stylesheet" href="/static/assets/theme.css?v=2" />
    <link rel="stylesheet" href="/static/assets/pages.css?v=1" />
  </head>
  <body>
    <div class="page wide">
      <header class="app-header">
        <a class="app-brand" href="/" aria-label="Tonies-YT home"><img src="/static/assets/tonie-box-icon.webp?v=1" alt="" width="34" height="34" /><span>Tonies-YT <small>Audio workspace</small></span></a>
        <a href="/" class="back-link">← Back to workspace</a>
      </header>
      <div class="page-heading">
        <h1>Application logs</h1>
        <p class="desc">Recent server log lines, newest last.</p>
      </div>

      <div class="card log-toolbar">
        <div class="row">
          <span class="chip mono" id="log-file">file: -</span>
          <span class="chip" id="log-level">level: -</span>
        </div>
        <div class="row">
          <label for="line-count">Lines</label>
          <select id="line-count">
            <option>200</option>
            <option selected>500</option>
            <option>1000</option>
            <option>2000</option>
          </select>
          <button id="refresh" class="ghost">Refresh</button>
          <button id="export" class="ghost">Export .txt</button>
        </div>
      </div>

      <pre id="log-output" class="log-output">Loading logs…</pre>
    </div>

    <script src="/static/assets/session.js?v=1"></script>
    <script>
      const out = document.getElementById('log-output');
      const fileEl = document.getElementById('log-file');
      const lvlEl = document.getElementById('log-level');
      const lineCountEl = document.getElementById('line-count');
      const refreshBtn = document.getElementById('refresh');
      const exportBtn = document.getElementById('export');

      async function refreshLogs() {
        const lines = Number(lineCountEl.value || 500);
        const r = await fetch(`/api/logs?lines=${lines}`);
        const data = await r.json();
        fileEl.textContent = `file: ${data.file || '-'}`;
        lvlEl.textContent = `level: ${data.level || '-'}`;
        const rows = data.lines || [];
        out.textContent = rows.length ? rows.join('\n') : '(no log lines yet)';
        out.scrollTop = out.scrollHeight;
      }

      refreshBtn.onclick = refreshLogs;
      exportBtn.onclick = () => {
        const lines = Number(lineCountEl.value || 500);
        window.open(`/api/logs/export?lines=${lines}`, '_blank');
      };
      lineCountEl.onchange = refreshLogs;
      refreshLogs();
      setInterval(refreshLogs, 3000);
    </script>
  </body>
</html>
