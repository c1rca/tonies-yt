name: release image

# Publishes ghcr.io/c1rca/tonies-yt for PCs (amd64) and Raspberry Pis (arm64) when a
# version tag is pushed. A manual run builds and smoke-tests without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Actions are pinned to commits (tag in the comment) because this job can publish packages.
permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/c1rca/tonies-yt
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Build for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          tags: tonies-yt:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name smoke --user 10001:10001 --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --tmpfs /tmp -v smoke-data:/app/data \
            -p 127.0.0.1:8090:8080 tonies-yt:smoke
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/api/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8090/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/api/jobs)" = 401
          docker exec smoke ffmpeg -version > /dev/null
          docker exec smoke deno --version > /dev/null
      - name: Smoke test logs
        if: failure()
        run: docker logs smoke || true
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
